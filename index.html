<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Забронировать столик</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Забронировать столик</h1>
  <form id="booking-form">
    <label>Ваше имя <input type="text" name="name" required></label>
    <label>Телефон <input type="tel" name="phone" required></label>
    <label>Дата <input type="date" name="date" required></label>
    <label>Время <input type="time" name="time" required></label>
    <label>Количество гостей <input type="number" name="guests" min="1" max="10" value="2" required></label>
    <button type="submit">Забронировать</button>
  </form>
  <p id="result"></p>
<h2>Все брони</h2>
  <ul id="bookings-list"></ul>
  <script src="app.js"></script>
</body>
</html>
